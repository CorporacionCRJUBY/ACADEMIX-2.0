# Optional local dev stack — MySQL + backend + frontend.
version: '3.8'
services:
  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      # Debe coincidir con DB_NAME en backend/.env (la app usa 'academix_v2')
      MYSQL_DATABASE: academix_v2
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Dentro de la red de docker-compose el host de la BD es el nombre del
      # servicio, no 'localhost' (que en el contenedor del backend no apunta a nada)
      DB_HOST: db
    ports:
      # backend/src/server.js escucha en PORT (5000 por defecto en .env)
      - '5000:5000'
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  db_data:
